<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <title>تسجيل الدخول — InventoryHub</title>
    <link rel="stylesheet" href="/assets/css/login.css?v=1">
</head>
<body>
    <div class="background" aria-hidden="true">
        <span class="glow glow-one"></span>
        <span class="glow glow-two"></span>
        <span class="grid"></span>
    </div>

    <main class="login-layout">
        <a class="brand" href="/">
            <span class="brand-mark">T</span>
            <span>InventoryHub</span>
        </a>

        <section class="login-card">
            <div class="card-icon" aria-hidden="true">⌁</div>
            <p class="eyebrow">Admin dashboard</p>
            <h1>أهلًا بعودتك</h1>
            <p class="intro">سجّل الدخول للوصول إلى لوحة إدارة المنتجات.</p>

            <form id="login-form" novalidate>
                <label for="username">اسم المستخدم</label>
                <div class="input-wrap">
                    <span aria-hidden="true">♙</span>
                    <input id="username" type="text" autocomplete="username" placeholder="أدخل اسم المستخدم" required autofocus>
                </div>

                <label for="password">كلمة المرور</label>
                <div class="input-wrap">
                    <span aria-hidden="true">●</span>
                    <input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required>
                    <button id="toggle-password" class="toggle-password" type="button" aria-label="إظهار كلمة المرور">إظهار</button>
                </div>

                <p id="login-error" class="login-error" role="alert"></p>
                <button id="login-button" class="login-button" type="submit">تسجيل الدخول <span aria-hidden="true">←</span></button>
            </form>
        </section>

        <p class="footer-text">Protected admin area · InventoryHub</p>
    </main>

    <script type="module" src="/assets/js/login.js?v=1"></script>
</body>
</html>
